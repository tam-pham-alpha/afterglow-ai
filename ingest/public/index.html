<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Afterglow ingest — admin</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0f;
        --ink: #e6eaf0;
        --muted: #8b93a0;
        --line: rgba(176, 196, 220, 0.2);
        --glow: #9eb4cc;
        --card: #12141a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 70% 50% at 50% 0%, rgba(158, 180, 204, 0.14), transparent 70%),
          var(--bg);
      }
      main {
        width: min(56rem, calc(100% - 2rem));
        margin: 2rem auto 3rem;
      }
      h1 { font-size: 1.2rem; margin: 0 0 0.35rem; }
      .sub { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.92rem; }
      .tabs {
        display: flex;
        gap: 0.35rem;
        margin-bottom: 0;
        border-bottom: 1px solid var(--line);
      }
      .tabs button {
        margin: 0;
        background: transparent;
        color: var(--muted);
        border: 1px solid transparent;
        border-bottom: 0;
        border-radius: 0.4rem 0.4rem 0 0;
        padding: 0.55rem 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      .tabs button[aria-selected="true"] {
        color: var(--ink);
        background: var(--card);
        border-color: var(--line);
      }
      .panel {
        display: none;
        background: var(--card);
        border: 1px solid var(--line);
        border-top: 0;
        border-radius: 0 0 0.55rem 0.55rem;
        padding: 1.15rem 1.25rem 1.3rem;
      }
      .panel.active { display: block; }
      label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.55rem 0 0.25rem; }
      textarea, input {
        width: 100%;
        background: #0b0b0f;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 0.35rem;
        padding: 0.65rem 0.75rem;
        font: inherit;
      }
      textarea.body {
        min-height: 18rem;
        resize: vertical;
      }
      .actions button {
        margin-top: 0.85rem;
        background: var(--glow);
        color: #0e141c;
        border: 0;
        border-radius: 999px;
        padding: 0.5rem 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        color: var(--muted);
        font-size: 0.82rem;
        margin: 0.75rem 0 0;
      }
      .err { color: #c9a4a4; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ingest</h1>
      <p class="sub">Admin gate. Instruction, seed, and map only. GitHub events stay on observer. Agents ask memory through MCP.</p>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-instruction" aria-controls="panel-instruction" aria-selected="true" data-tab="instruction">Instruction</button>
        <button type="button" role="tab" id="tab-seed" aria-controls="panel-seed" aria-selected="false" data-tab="seed">Seed</button>
        <button type="button" role="tab" id="tab-map" aria-controls="panel-map" aria-selected="false" data-tab="map">Map</button>
      </div>

      <section class="panel active" id="panel-instruction" role="tabpanel" aria-labelledby="tab-instruction">
        <label for="instruction">How Afterglow should understand this org</label>
        <textarea class="body" id="instruction" placeholder="Do not read Slack DMs. PAY- tickets belong to payments."></textarea>
        <div class="actions">
          <button type="button" id="save-instruction">Save instruction</button>
        </div>
        <pre id="instruction-meta"></pre>
      </section>

      <section class="panel" id="panel-seed" role="tabpanel" aria-labelledby="tab-seed">
        <label for="seed-title">Title</label>
        <input id="seed-title" placeholder="Aeron ADR" />
        <label for="seed-component">Component id</label>
        <input id="seed-component" placeholder="org/payments" />
        <label for="seed-url">Evidence URL (optional)</label>
        <input id="seed-url" placeholder="https://…" />
        <label for="seed-body">Body</label>
        <textarea class="body" id="seed-body" placeholder="Paste an ADR or postmortem."></textarea>
        <div class="actions">
          <button type="button" id="save-seed">Add seed</button>
        </div>
        <pre id="seeds"></pre>
      </section>

      <section class="panel" id="panel-map" role="tabpanel" aria-labelledby="tab-map">
        <label for="map-employee">Employee handle</label>
        <input id="map-employee" placeholder="tam-pham-alpha" />
        <label for="map-component">Component id / name</label>
        <input id="map-component" placeholder="org/afterglow-ai" />
        <label for="map-repo">Watched repo</label>
        <input id="map-repo" placeholder="tam-pham-alpha/afterglow-ai" />
        <div class="actions">
          <button type="button" id="save-map">Merge into map</button>
        </div>
        <pre id="map"></pre>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);

      function showTab(name) {
        document.querySelectorAll(".tabs [role='tab']").forEach((tab) => {
          const on = tab.dataset.tab === name;
          tab.setAttribute("aria-selected", on ? "true" : "false");
        });
        document.querySelectorAll(".panel").forEach((panel) => {
          panel.classList.toggle("active", panel.id === `panel-${name}`);
        });
        history.replaceState(null, "", `#${name}`);
      }

      document.querySelectorAll(".tabs [role='tab']").forEach((tab) => {
        tab.addEventListener("click", () => showTab(tab.dataset.tab));
      });

      const initial = location.hash.replace("#", "");
      if (["instruction", "seed", "map"].includes(initial)) {
        showTab(initial);
      }

      async function load() {
        const instruction = await (await fetch("/instructions")).json();
        $("instruction").value = instruction.current || "";
        $("instruction-meta").textContent = instruction.versions?.length
          ? `${instruction.versions.length} previous version(s)`
          : "No previous versions";
        const seeds = await (await fetch("/seeds")).json();
        $("seeds").textContent = seeds.length
          ? seeds.map((s) => `${s.status} · ${s.title || s.id} · ${s.evidence.ref}`).join("\n")
          : "No seeds yet.";
        const map = await (await fetch("/map")).json();
        $("map").textContent = JSON.stringify(map, null, 2);
      }

      $("save-instruction").onclick = async () => {
        const res = await fetch("/instructions", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ body: $("instruction").value }),
        });
        if (!res.ok) {
          $("instruction-meta").className = "err";
          $("instruction-meta").textContent = await res.text();
          return;
        }
        $("instruction-meta").className = "";
        await load();
      };

      $("save-seed").onclick = async () => {
        const res = await fetch("/seeds", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: $("seed-title").value,
            componentId: $("seed-component").value || undefined,
            url: $("seed-url").value || undefined,
            body: $("seed-body").value || undefined,
          }),
        });
        if (!res.ok) {
          $("seeds").className = "err";
          $("seeds").textContent = await res.text();
          return;
        }
        $("seeds").className = "";
        $("seed-body").value = "";
        await load();
      };

      $("save-map").onclick = async () => {
        const handle = $("map-employee").value.trim();
        const component = $("map-component").value.trim();
        const repo = $("map-repo").value.trim();
        const current = await (await fetch("/map")).json();
        const body = {
          employees: handle
            ? [...current.employees.filter((e) => e.id !== handle), { id: handle, handle }]
            : current.employees,
          components: component
            ? [
                ...current.components.filter((c) => c.id !== component),
                { id: component, name: component.split("/").pop() },
              ]
            : current.components,
          documents: current.documents,
          watchedRepos: repo
            ? [...current.watchedRepos.filter((r) => r.repo !== repo), { repo }]
            : current.watchedRepos,
        };
        await fetch("/map", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        await load();
      };

      load();
    </script>
  </body>
</html>
