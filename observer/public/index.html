<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Afterglow — events</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0f;
        --ink: #e6eaf0;
        --muted: #8b93a0;
        --line: rgba(176, 196, 220, 0.2);
        --glow: #9eb4cc;
        --card: #12141a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 70% 50% at 50% 0%, rgba(158, 180, 204, 0.14), transparent 70%),
          var(--bg);
      }

      main {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 1.25rem 1.25rem 2rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.6rem;
        padding: 1.25rem 1.35rem 1.4rem;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      }

      .card header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 1.1rem;
      }

      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .badge {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.65rem;
        margin-bottom: 1.25rem;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        padding: 0.7rem 0.75rem;
      }

      .metric .n {
        display: block;
        font-size: 1.55rem;
        font-variant-numeric: tabular-nums;
        color: var(--glow);
      }

      .metric .l {
        color: var(--muted);
        font-size: 0.78rem;
      }

      h2 {
        margin: 1.1rem 0 0.45rem;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }

      th,
      td {
        text-align: left;
        padding: 0.4rem 0.2rem;
        border-top: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .time {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .empty,
      .err {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .err {
        color: #c9a4a4;
      }

      .kind {
        color: var(--glow);
        font-size: 0.8rem;
        white-space: nowrap;
      }

      .title {
        color: var(--ink);
        font-size: 0.9rem;
      }

      .payload-btn {
        background: transparent;
        color: var(--glow);
        border: 1px solid var(--line);
        border-radius: 0.3rem;
        padding: 0.2rem 0.5rem;
        font: inherit;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .payload-btn:disabled {
        color: var(--muted);
        cursor: not-allowed;
      }

      .payload-btn[aria-expanded="true"] {
        background: rgba(158, 180, 204, 0.12);
      }

      #modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
      }

      #modal.open {
        display: flex;
      }

      #modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(6, 7, 10, 0.72);
      }

      #modal-dialog {
        position: relative;
        z-index: 1;
        width: min(56rem, 100%);
        max-height: calc(100vh - 2.5rem);
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.6rem;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        padding: 1.1rem 1.2rem 1.2rem;
      }

      #modal-dialog header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 0.75rem;
      }

      #modal-dialog h3 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 600;
      }

      #modal-dialog pre {
        margin: 0;
        flex: 1;
        min-height: 12rem;
        overflow: auto;
        background: #0b0b0f;
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        padding: 0.75rem 0.85rem;
        font-size: 0.78rem;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }

      @media (max-width: 640px) {
        .metrics {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="card">
        <div id="card">
          <header>
            <h1>Afterglow</h1>
            <span class="badge">observer · events</span>
          </header>
          <p class="empty" id="status">Loading events…</p>
        </div>
      </article>
    </main>
    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
      <div id="modal-backdrop"></div>
      <div id="modal-dialog">
        <header>
          <h3 id="modal-title">Payload</h3>
          <button type="button" class="payload-btn" id="modal-close">Close</button>
        </header>
        <pre id="modal-body"></pre>
      </div>
    </div>
    <script>
      const card = document.getElementById("card");
      const modal = document.getElementById("modal");
      const modalTitle = document.getElementById("modal-title");
      const modalBody = document.getElementById("modal-body");
      let openId = "";

      function esc(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function formatTime(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) {
          return iso;
        }
        return date.toLocaleString(undefined, {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
      }

      function renderHeader() {
        return `
          <header>
            <h1>Afterglow</h1>
            <span class="badge">observer · newest first</span>
          </header>`;
      }

      function closeModal() {
        openId = "";
        modal.classList.remove("open");
        modal.hidden = true;
        modalBody.textContent = "";
        document.body.style.overflow = "";
        card.querySelectorAll(".payload-btn[aria-expanded='true']").forEach((btn) => {
          btn.setAttribute("aria-expanded", "false");
        });
      }

      function render(payload) {
        if (!payload || typeof payload.total !== "number" || !Array.isArray(payload.items)) {
          card.innerHTML = `
            ${renderHeader()}
            <p class="err">${esc(payload && payload.error ? payload.error : "failed to load events")}</p>`;
          return;
        }

        const kinds = new Set(payload.items.map((row) => row.event)).size;
        const rows = payload.items.length
          ? `
            <table>
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Event</th>
                  <th>Name</th>
                  <th>Component</th>
                  <th>Actor</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${payload.items
                  .map((row) => {
                    const name = row.title || row.summary || row.action || "—";
                    const canOpen = Boolean(row.hasPayload);
                    return `<tr>
                      <td class="time" title="${esc(row.receivedAt)}">${esc(formatTime(row.receivedAt))}</td>
                      <td class="kind">${esc(row.event)}</td>
                      <td class="title">${esc(name)}</td>
                      <td>${esc(row.componentId || row.componentName || "—")}</td>
                      <td>${esc(row.actor || "—")}</td>
                      <td>
                        <button
                          type="button"
                          class="payload-btn"
                          data-id="${esc(row.id)}"
                          ${canOpen ? "" : "disabled"}
                          aria-expanded="${openId === row.id ? "true" : "false"}"
                        >Payload</button>
                      </td>
                    </tr>`;
                  })
                  .join("")}
              </tbody>
            </table>`
          : '<p class="empty">No events yet.</p>';

        card.innerHTML = `
          ${renderHeader()}
          <div class="metrics">
            <div class="metric"><span class="n">${payload.total}</span><span class="l">Events stored</span></div>
            <div class="metric"><span class="n">${kinds}</span><span class="l">Event types</span></div>
          </div>
          <h2>All events</h2>
          ${rows}`;
      }

      async function openPayload(id) {
        if (openId === id) {
          closeModal();
          return;
        }
        modalTitle.textContent = "Loading payload…";
        modalBody.textContent = "";
        modal.hidden = false;
        modal.classList.add("open");
        document.body.style.overflow = "hidden";
        openId = id;
        card.querySelectorAll(".payload-btn").forEach((btn) => {
          btn.setAttribute("aria-expanded", btn.getAttribute("data-id") === id ? "true" : "false");
        });
        try {
          const res = await fetch(`/events/${encodeURIComponent(id)}`);
          if (!res.ok) {
            modalTitle.textContent = "Payload";
            modalBody.textContent = `HTTP ${res.status}`;
            return;
          }
          const row = await res.json();
          const name = row.title || row.event;
          modalTitle.textContent = `${row.event}${name ? ` · ${name}` : ""}`;
          modalBody.textContent =
            row.payload == null
              ? "No payload stored for this event."
              : JSON.stringify(row.payload, null, 2);
        } catch (err) {
          modalTitle.textContent = "Payload";
          modalBody.textContent = err.message || "failed to load";
        }
      }

      card.addEventListener("click", (event) => {
        const btn = event.target.closest(".payload-btn");
        if (!btn || btn.disabled) {
          return;
        }
        void openPayload(btn.getAttribute("data-id"));
      });

      document.getElementById("modal-close").addEventListener("click", closeModal);
      document.getElementById("modal-backdrop").addEventListener("click", closeModal);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && openId) {
          closeModal();
        }
      });

      async function refresh() {
        try {
          const res = await fetch("/events");
          if (!res.ok) {
            render({ error: `HTTP ${res.status}` });
            return;
          }
          render(await res.json());
        } catch (err) {
          render({ error: err.message || "failed to load" });
        }
      }

      refresh();
      setInterval(refresh, 8000);
    </script>
  </body>
</html>
