<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Afterglow — overview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0f;
        --ink: #e6eaf0;
        --muted: #8b93a0;
        --line: rgba(176, 196, 220, 0.2);
        --glow: #9eb4cc;
        --card: #12141a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 70% 50% at 50% 0%, rgba(158, 180, 204, 0.14), transparent 70%),
          var(--bg);
      }

      main {
        width: min(42rem, calc(100% - 2rem));
        margin: 2rem auto 3rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.6rem;
        padding: 1.25rem 1.35rem 1.4rem;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      }

      .card header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        margin-bottom: 1.1rem;
      }

      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .badge {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.65rem;
        margin-bottom: 1.25rem;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        padding: 0.7rem 0.75rem;
      }

      .metric .n {
        display: block;
        font-size: 1.55rem;
        font-variant-numeric: tabular-nums;
        color: var(--glow);
      }

      .metric .l {
        color: var(--muted);
        font-size: 0.78rem;
      }

      h2 {
        margin: 1.1rem 0 0.45rem;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }

      th,
      td {
        text-align: left;
        padding: 0.4rem 0.2rem;
        border-top: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .empty,
      .err {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .err {
        color: #c9a4a4;
      }

      .kind {
        color: var(--glow);
        font-size: 0.8rem;
      }

      @media (max-width: 640px) {
        .metrics {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="card" id="card">
        <header>
          <h1>Afterglow</h1>
          <span class="badge">overview · display only</span>
        </header>
        <p class="empty" id="status">Loading observer…</p>
      </article>
    </main>
    <script>
      const card = document.getElementById("card");

      function esc(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function rows(items, render) {
        if (!items.length) {
          return '<p class="empty">None yet.</p>';
        }
        return render(items);
      }

      function render(payload) {
        if (!payload.ok) {
          card.innerHTML = `
            <header>
              <h1>Afterglow</h1>
              <span class="badge">overview · display only</span>
            </header>
            <p class="err">Observer unreachable: ${esc(payload.error)}</p>`;
          return;
        }

        const s = payload.snapshot;
        const rels = rows(
          s.relationships.items,
          (items) => `
            <table>
              <thead><tr><th>Employee</th><th>Component</th><th>Link</th></tr></thead>
              <tbody>
                ${items
                  .map(
                    (row) => `<tr>
                      <td>${esc(row.employeeHandle)}</td>
                      <td>${esc(row.componentName)}</td>
                      <td class="kind">${esc(row.kind)}</td>
                    </tr>`,
                  )
                  .join("")}
              </tbody>
            </table>`,
        );
        const docs = rows(
          s.docs.byComponent,
          (items) => `
            <table>
              <thead><tr><th>Component</th><th>Docs</th></tr></thead>
              <tbody>
                ${items
                  .map(
                    (row) => `<tr>
                      <td>${esc(row.componentId)}</td>
                      <td>${esc(row.count)}</td>
                    </tr>`,
                  )
                  .join("")}
              </tbody>
            </table>`,
        );

        card.innerHTML = `
          <header>
            <h1>Afterglow</h1>
            <span class="badge">overview · display only</span>
          </header>
          <div class="metrics">
            <div class="metric"><span class="n">${s.hooks.total}</span><span class="l">Hooks triggered</span></div>
            <div class="metric"><span class="n">${s.employees.total}</span><span class="l">Employees</span></div>
            <div class="metric"><span class="n">${s.components.total}</span><span class="l">Components</span></div>
            <div class="metric"><span class="n">${s.docs.total}</span><span class="l">Docs</span></div>
          </div>
          <h2>Employee — component</h2>
          ${rels}
          <h2>Docs by component</h2>
          ${docs}`;
      }

      async function refresh() {
        try {
          const res = await fetch("/api/overview");
          render(await res.json());
        } catch (err) {
          render({ ok: false, error: err.message || "failed to load" });
        }
      }

      refresh();
      setInterval(refresh, 8000);
    </script>
  </body>
</html>
